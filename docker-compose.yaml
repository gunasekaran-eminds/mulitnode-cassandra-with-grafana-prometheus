services:
  cassandra1:
    image: cassandra-with-jmx
    container_name: cassandra1
    ports:
      - "9042:9042"
      - "7070:7070"
    environment:
      JVM_EXTRA_OPTS: "-javaagent:/opt/jmx_prometheus_javaagent-0.20.0.jar=7070:/opt/cassandra-jmx-exporter.yaml"
    networks:
      - cassandra

  cassandra2:
    image: cassandra-with-jmx
    container_name: cassandra2
    ports:
      - "9043:9042"
      - "7071:7070"
    environment:
      JVM_EXTRA_OPTS: "-javaagent:/opt/jmx_prometheus_javaagent-0.20.0.jar=7070:/opt/cassandra-jmx-exporter.yaml"
    networks:
      - cassandra

  cassandra3:
    image: cassandra-with-jmx
    container_name: cassandra3
    ports:
      - "9044:9042"
      - "7072:7070"
    environment:
      JVM_EXTRA_OPTS: "-javaagent:/opt/jmx_prometheus_javaagent-0.20.0.jar=7070:/opt/cassandra-jmx-exporter.yaml"
    networks:
      - cassandra

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cassandra

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - cassandra

networks:
  cassandra:
